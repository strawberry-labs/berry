name: Web platform

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/mem0/**"
      - "packages/**"
      - "scripts/prepare-web-build.mjs"
      - "scripts/verify-web-build-assets.mjs"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "apps/worker/**"
      - "apps/mem0/**"
      - "packages/**"
      - "scripts/prepare-web-build.mjs"
      - "scripts/verify-web-build-assets.mjs"
      - "deploy/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: web-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile web platform
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment assets
        run: pnpm check:compose && pnpm check:docker && pnpm check:ci && pnpm check:deploy

      - name: Build web stack
        run: >-
          pnpm --filter @berry/web... --filter @berry/api... --filter @berry/worker...
          --filter @berry/mem0... build

      - name: Typecheck web stack
        run: >-
          pnpm --filter @berry/web... --filter @berry/api... --filter @berry/worker...
          --filter @berry/mem0... typecheck

      - name: Test web stack
        run: >-
          pnpm --filter @berry/shared --filter @berry/db --filter @berry/api
          --filter @berry/worker --filter @berry/mem0 --filter @berry/web test

  chromium-workflow:
    name: Chromium web workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @berry/web exec playwright install --with-deps chromium

      - name: Run required Chromium workflows
        run: pnpm --filter @berry/web exec playwright test --project=chromium

      - name: Upload Chromium failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-workflow-failures
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/test-results/
            apps/web/playwright-report/

  production-integration:
    name: Production runtime integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: berry
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d berry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      tika:
        image: apache/tika:3.2.3.0-full
        ports:
          - 9998:9998

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build durable runtime
        run: pnpm --filter @berry/api... --filter @berry/worker... build

      - name: Start object storage
        run: >-
          docker run --detach --name berry-ci-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=berry
          --env MINIO_ROOT_PASSWORD=berry-integration-password
          minio/minio:RELEASE.2025-09-07T16-13-09Z
          server /data

      - name: Apply migrations
        env:
          BERRY_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/berry
        run: node apps/api/dist/migrate.js

      - name: Configure least-privilege database roles
        env:
          BERRY_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/berry
          BERRY_API_DATABASE_PASSWORD: api-integration-password
          BERRY_WORKER_DATABASE_PASSWORD: worker-integration-password
          BERRY_PLATFORM_DATABASE_PASSWORD: platform-integration-password
        run: node apps/api/dist/configure-service-roles.js

      - name: Verify file lifecycle migration and backfill
        env:
          BERRY_INTEGRATION_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/berry
        run: node apps/worker/scripts/verify-file-lifecycle-migration.mjs

      - name: Verify production runtime
        env:
          BERRY_INTEGRATION_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/berry
          BERRY_INTEGRATION_API_DATABASE_URL: postgres://berry_api:api-integration-password@127.0.0.1:5432/berry
          BERRY_INTEGRATION_WORKER_DATABASE_URL: postgres://berry_worker:worker-integration-password@127.0.0.1:5432/berry
          BERRY_INTEGRATION_S3_ENDPOINT: http://127.0.0.1:9000
          BERRY_INTEGRATION_S3_ACCESS_KEY_ID: berry
          BERRY_INTEGRATION_S3_SECRET_ACCESS_KEY: berry-integration-password
          BERRY_INTEGRATION_TIKA_URL: http://127.0.0.1:9998
          BERRY_INTEGRATION_REDIS_HOST: 127.0.0.1
          BERRY_INTEGRATION_REDIS_PORT: 6379
        run: node apps/worker/scripts/verify-production-runtime.mjs

      - name: Install lifecycle browser engines
        run: pnpm --filter @berry/web exec playwright install --with-deps chromium webkit

      - name: Verify real file lifecycle in the browser
        env:
          BERRY_FILE_LIFECYCLE_E2E_REAL: "true"
          BERRY_FILE_LIFECYCLE_E2E_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/berry
          BERRY_FILE_LIFECYCLE_E2E_API_DATABASE_URL: postgres://berry_api:api-integration-password@127.0.0.1:5432/berry
          BERRY_FILE_LIFECYCLE_E2E_S3_ENDPOINT: http://127.0.0.1:9000
          BERRY_FILE_LIFECYCLE_E2E_S3_ACCESS_KEY_ID: berry
          BERRY_FILE_LIFECYCLE_E2E_S3_SECRET_ACCESS_KEY: berry-integration-password
        run: pnpm --filter @berry/web exec playwright test --config playwright.file-lifecycle.config.ts

      - name: Upload file-lifecycle failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: file-lifecycle-playwright-failures
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/web/test-results/file-lifecycle/
            apps/web/playwright-report/
