deploymentMode: self-hosted

image:
  repository: ghcr.io/berry/berry-chat
  tag: "0.1.0"
  pullPolicy: IfNotPresent

web:
  replicas: 2
  port: 3108
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

api:
  replicas: 2
  port: 3000
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 1
  concurrency: 4
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

tika:
  enabled: true
  image: apache/tika:3.2.3.0-full
  port: 9998

durableContext:
  memoryEnabled: true
  implicitMemoryEnabled: true
  projectKnowledgeEnabled: true
  promptCacheEnabled: true
  durableRunnerEnabled: true
  embeddingProvider: openai-compatible
  embeddingModel: sentence-transformers/all-mpnet-base-v2
  embeddingDimensions: 768
  embeddingProfileVersion: 2
  chunkTokens: 300
  chunkOverlapTokens: 50
  retrievalTokenBudget: 5000
  compactionTriggerTokens: 120000
  runLeaseSeconds: 90
  snapshotIntervalSeconds: 900
  maxInputBytes: "104857600"
  maxOutputBytes: "26214400"
  sandboxInputMaxBytes: "104857600"
  maxModelIterations: "12"
  maxToolCalls: "48"
  maxTotalTokens: "250000"
  maxSpendMicros: "1000000"
  maxWallTimeSeconds: "1800"

mem0:
  enabled: true
  replicas: 1
  port: 8010
  timeoutMs: 30000
  collection: berry_personal_memories
  telemetry: "false"
  llmModel: gpt-5-mini
  embeddingModel: sentence-transformers/all-mpnet-base-v2
  embeddingDimensions: 768
  existingSecret: berry-mem0
  apiKeyKey: BERRY_MEM0_API_KEY
  databaseUrlKey: BERRY_MEM0_DATABASE_URL

external:
  postgres:
    url: ""
    existingSecret: berry-postgres
    migrationSecretKey: BERRY_MIGRATION_DATABASE_URL
    apiSecretKey: BERRY_API_DATABASE_URL
    workerSecretKey: BERRY_WORKER_DATABASE_URL
    platformSecretKey: BERRY_PLATFORM_DATABASE_URL
    apiPasswordKey: BERRY_API_DATABASE_PASSWORD
    workerPasswordKey: BERRY_WORKER_DATABASE_PASSWORD
    platformPasswordKey: BERRY_PLATFORM_DATABASE_PASSWORD
  redis:
    url: ""
    existingSecret: berry-redis
    secretKey: BERRY_REDIS_URL
  s3:
    endpoint: ""
    publicEndpoint: ""
    artifactBucket: berry-artifacts
    auditBucket: berry-audit
    region: us-east-1
    existingSecret: berry-s3
    accessKeyIdKey: BERRY_ARTIFACT_S3_ACCESS_KEY_ID
    secretAccessKeyKey: BERRY_ARTIFACT_S3_SECRET_ACCESS_KEY

files:
  maxUploadBytes: "1073741824"
  multipartPartSize: "16777216"
  presignSeconds: "900"

auth:
  mode: better-auth
  baseUrl: ""
  trustedOrigins: ""
  signupEnabled: "false"
  setupOwnerEmail: ""
  existingSecret: berry-auth
  betterAuthSecretKey: BETTER_AUTH_SECRET
  setupTokenKey: BERRY_SETUP_TOKEN
  scimBearerTokenKey: BERRY_SCIM_BEARER_TOKEN

policy:
  existingSecret: berry-policy-signing
  keyIdKey: BERRY_POLICY_SIGNING_KEY_ID
  privateKeyPemKey: BERRY_POLICY_SIGNING_PRIVATE_KEY_PEM

usage:
  existingSecret: berry-usage-signing
  signingSecretsKey: BERRY_USAGE_SIGNING_SECRETS

billing:
  provider: none
  stripeApiBaseUrl: https://api.stripe.com
  existingSecret: berry-billing
  stripeSecretKeyKey: STRIPE_SECRET_KEY
  stripeMeterEventNameKey: STRIPE_BILLING_METER_EVENT_NAME
  stripeCreditPriceIdKey: STRIPE_CREDIT_PRICE_ID

router:
  inferenceBaseUrl: ""
  completionTransport: stream
  providerId: router
  chatCompletionsPath: /chat/completions
  defaultModel: berry/auto
  modelsJson: "[]"
  organizationProviderAllowedHosts: ""
  organizationProviderAllowInsecureHttp: "false"
  existingSecret: berry-router
  apiKeyKey: BERRY_ROUTER_API_KEY
  organizationProviderCredentialsKey: BERRY_ORGANIZATION_PROVIDER_CREDENTIALS_JSON

sandbox:
  provider: e2b
  templateId: base
  domain: ""
  requestTimeoutMs: 60000
  ttlSeconds: 900
  keepMemoryOnPause: false
  cpuCount: 2
  memoryMiB: 4096
  diskMiB: 10240
  estimatedHourlyCostMicros: 0
  minimumExecCostMicros: 0
  existingSecret: berry-e2b
  apiKeyKey: E2B_API_KEY

ingress:
  enabled: false
  className: ""
  webHost: berry.example.com
  apiHost: api.berry.example.com
  tlsSecretName: ""
