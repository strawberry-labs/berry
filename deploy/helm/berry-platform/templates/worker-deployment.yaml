apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "berry-platform.name" . }}-worker
  labels:
    {{- include "berry-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "berry-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "berry-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "apps/worker/dist/main.js"]
          envFrom:
            - configMapRef:
                name: {{ include "berry-platform.name" . }}-config
          env:
            - name: BERRY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.postgres.existingSecret }}
                  key: {{ .Values.external.postgres.workerSecretKey }}
            - name: BERRY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.redis.existingSecret }}
                  key: {{ .Values.external.redis.secretKey }}
            - name: BERRY_ROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.router.existingSecret }}
                  key: {{ .Values.router.apiKeyKey }}
            - name: BERRY_DURABLE_CAPABILITY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.router.existingSecret }}
                  key: {{ .Values.router.durableCapabilityKeyKey }}
                  optional: true
            - name: BERRY_ORGANIZATION_PROVIDER_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.router.existingSecret }}
                  key: {{ .Values.router.organizationProviderCredentialsKey }}
                  optional: true
            {{ if .Values.mem0.enabled }}
            - name: BERRY_MEM0_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mem0.existingSecret }}
                  key: {{ .Values.mem0.apiKeyKey }}
            {{ end }}
            {{ if eq .Values.sandbox.provider "e2b" }}
            - name: E2B_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.sandbox.existingSecret }}
                  key: {{ .Values.sandbox.apiKeyKey }}
            {{ end }}
            - name: BERRY_ARTIFACT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.s3.existingSecret }}
                  key: {{ .Values.external.s3.accessKeyIdKey }}
            - name: BERRY_ARTIFACT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.external.s3.existingSecret }}
                  key: {{ .Values.external.s3.secretAccessKeyKey }}
